<!DOCTYPE html>
<html>
<head>
<title>10 CSS Text Effects</title>

<style>
body{
    font-family: Arial;
    background:#f4f4f4;
    text-align:center;
}

/* 1 Color */
.color{
    color:blue;
}

/* 2 Bold */
.bold{
    font-weight:bold;
}

/* 3 Italic */
.italic{
    font-style:italic;
}

/* 4 Underline */
.underline{
    text-decoration:underline;
}

/* 5 Uppercase */
.uppercase{
    text-transform:uppercase;
}

/* 6 Letter Spacing */
.letter{
    letter-spacing:5px;
}

/* 7 Word Spacing */
.word{
    word-spacing:10px;
}

/* 8 Text Shadow */
.shadow{
    font-size:30px;
    text-shadow:3px 3px 5px gray;
}

/* 9 Background Highlight */
.highlight{
    background:yellow;
}

/* 10 Outline */
.outline{
    font-size:30px;
    color:white;
    -webkit-text-stroke:1px black;
}

</style>
</head>

<body>

<h1>CSS Text Styling Demonstration</h1>

<p class="color">This text shows color property.</p>

<p class="bold">This text is bold.</p>

<p class="italic">This text is italic.</p>

<p class="underline">This text is underlined.</p>

<p class="uppercase">this text becomes uppercase.</p>

<p class="letter">Letter Spacing Example</p>

<p class="word">Word spacing example here</p>

<p class="shadow">Text Shadow Effect</p>

<p class="highlight">Highlighted Text</p>

<p class="outline">Outline Text Effect</p>

</body>
</html>

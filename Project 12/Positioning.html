<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Positioning Experience</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            overflow-x: hidden;
        }

        /* ================= NAVBAR (STICKY) ================= */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        /* ================= HERO ================= */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 55px;
            animation: fadeIn 2s ease;
        }

        /* FLOATING SHAPES (ABSOLUTE) */
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 6s infinite ease-in-out;
        }

        .s1 { width: 120px; height: 120px; background: cyan; top: 10%; left: 5%; }
        .s2 { width: 180px; height: 180px; background: magenta; bottom: 10%; right: 5%; }
        .s3 { width: 90px; height: 90px; background: yellow; top: 50%; left: 80%; }

        @keyframes float {
            50% { transform: translateY(-40px); }
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        /* ================= SECTION TITLE (STICKY) ================= */
        .section-title {
            position: sticky;
            top: 70px;
            background: rgba(0,0,0,0.7);
            padding: 12px;
            text-align: center;
            font-size: 20px;
            margin-top: 30px;
            z-index: 500;
        }

        /* ================= CARDS ================= */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 40px;
        }

        .card {
            position: relative;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            transition: 0.4s;
            overflow: hidden;
        }

        .card:hover {
            transform: scale(1.05);
        }

        /* BADGE (ABSOLUTE) */
        .badge {
            position: absolute;
            top: -10px;
            left: -10px;
            background: red;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 12px;
        }

        /* GLOW EFFECT (ABSOLUTE LAYER) */
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle, rgba(0,255,255,0.3), transparent);
            opacity: 0;
            transition: 0.4s;
        }

        .card:hover .glow {
            opacity: 1;
        }

        /* ================= RELATIVE + ABSOLUTE DEMO ================= */
        .demo-box {
            position: relative;
            margin: 40px;
            padding: 50px;
            background: #1abc9c;
            border-radius: 20px;
            text-align: center;
        }

        .demo-child {
            position: absolute;
            bottom: -20px;
            right: -20px;
            background: #f1c40f;
            color: black;
            padding: 10px;
            border-radius: 10px;
        }

        /* ================= FIXED BUTTON ================= */
        .fixed-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #00ffcc;
            color: black;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            transition: 0.3s;
            z-index: 2000;
        }

        .fixed-btn:hover {
            transform: scale(1.2) rotate(10deg);
        }

        /* ================= STATIC ================= */
        .static-box {
            margin: 20px;
            padding: 20px;
            background: #e74c3c;
            border-radius: 10px;
        }

        /* SCROLL SPACE */
        .space {
            height: 600px;
        }

    </style>
</head>

<body>

    <!-- STICKY NAV -->
    <div class="navbar">
        <div class="logo">⚡ Ultra UI</div>
        <div>CSS Positions Master</div>
    </div>

    <!-- HERO -->
    <div class="hero">
        <h1>INSANE POSITIONING 🔥</h1>

        <div class="shape s1"></div>
        <div class="shape s2"></div>
        <div class="shape s3"></div>
    </div>

    <!-- STATIC -->
    <div class="static-box">
        This is STATIC (normal flow)
    </div>

    <!-- RELATIVE + ABSOLUTE -->
    <div class="demo-box">
        RELATIVE BOX
        <div class="demo-child">ABSOLUTE 🚀</div>
    </div>

    <!-- STICKY TITLE -->
    <div class="section-title">🔥 Scroll Down — I Stick!</div>

    <!-- CARDS -->
    <div class="cards">
        <div class="card">
            <div class="badge">NEW</div>
            <div class="glow"></div>
            <h2>Absolute</h2>
            <p>Used for badges & effects</p>
        </div>

        <div class="card">
            <div class="badge">PRO</div>
            <div class="glow"></div>
            <h2>Relative</h2>
            <p>Parent positioning system</p>
        </div>

        <div class="card">
            <div class="badge">WOW</div>
            <div class="glow"></div>
            <h2>Sticky</h2>
            <p>Scroll-based magic ✨</p>
        </div>
    </div>

    <div class="space"></div>

    <!-- FIXED -->
    <div class="fixed-btn" onclick="scrollTop()">⬆</div>

    <script>
        function scrollTop() {
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>

</body>
</html>

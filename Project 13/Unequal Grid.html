<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fancy Unequal Grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .box:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .box1 { background: linear-gradient(45deg, #ff6a00, #ee0979); }
    .box2 { background: linear-gradient(45deg, #00c6ff, #0072ff); }
    .box3 { background: linear-gradient(45deg, #00f260, #0575e6); }
    .box4 { background: linear-gradient(45deg, #f7971e, #ffd200); }
    .box5 { background: linear-gradient(45deg, #8e2de2, #4a00e0); }

    h1 {
      text-align: center;
      margin: 30px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>✨ Fancy Unequal Bootstrap Grid</h1>

<div class="container">
  
  <!-- Row 1 -->
  <div class="row g-3">
    <div class="col-md-8">
      <div class="box box1">col-md-8</div>
    </div>
    <div class="col-md-4">
      <div class="box box2">col-md-4</div>
    </div>
  </div>

  <!-- Row 2 -->
  <div class="row g-3 mt-1">
    <div class="col-md-3">
      <div class="box box3">col-md-3</div>
    </div>
    <div class="col-md-6">
      <div class="box box4">col-md-6</div>
    </div>
    <div class="col-md-3">
      <div class="box box5">col-md-3</div>
    </div>
  </div>

  <!-- Row 3 -->
  <div class="row g-3 mt-1">
    <div class="col-md-4">
      <div class="box box2">col-md-4</div>
    </div>
    <div class="col-md-8">
      <div class="box box1">col-md-8</div>
    </div>
  </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Animated Box Model</title>

    <style>
        body {
            font-family: Arial, sans-serif;
       background-image: linear-gradient( 107.1deg,  rgba(111,63,255,1) 11.1%, rgba(21,192,229,1) 54.8%, rgba(255,229,189,1) 82.9% );
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        /* Margin Layer */
        .margin {
            background-color: rgba(255, 193, 7, 0.4);
            padding: 40px;
            transition: 0.4s;
        }

        /* Border Layer */
        .border {
            background-color: rgba(220, 53, 69, 0.4);
            padding: 30px;
            border: 6px solid red;
            transition: 0.4s;
        }

        /* Padding Layer */
        .padding {
            background-color: (40, 167, 69, 0.4);
            padding: 25px;
            transition: 0.4s;
        }

        /* Content Layer */
        .content {
            background-color: white;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;
        }

        /* Hover Effects */
        .margin:hover {
            transform: scale(1.05);
        }

        .border:hover {
            transform: scale(1.05);
        }

        .padding:hover {
            transform: scale(1.05);
        }

        .content:hover {
            transform: scale(1.05);
            background-color: #f1f1f1;
        }

        .labels {
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
        }

        .labels span {
            display: block;
            margin: 5px;
        }

    </style>
</head>

<body>

    <h1>Interactive CSS Box Model</h1>

    <div class="margin">
        <div class="border">
            <div class="padding">
                <div class="content">
                    CONTENT
                </div>
            </div>
        </div>
    </div>

    <div class="labels">
        <span>🟡 Margin (Outer Space)</span>
        <span>🔴 Border</span>
        <span>🟢 Padding (Inner Space)</span>
        <span>⚪ Content</span>
    </div>

</body>
</html>
